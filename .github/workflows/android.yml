name: Android APK

# Builds the Capacitor Android APK the same way `make android` does:
#   1. Vite builds the mobile web bundle  (ui → mobile/www)
#   2. Capacitor syncs it into the Android project
#   3. Gradle assembles the debug APK
#
# The APK is uploaded as a build artifact on every run, and also attached to a
# GitHub Release when a tag like v1.2.3 is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Skip runs that only touch unrelated code.
    paths:
      - "ui/**"
      - "mobile/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "ui/**"
      - "mobile/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {} # lets you trigger a build by hand from the Actions tab

permissions:
  contents: write # needed to create a Release on tag pushes

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 17 (required by Android Gradle Plugin 8.2)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            mobile/package-lock.json

      - name: Set up the Android SDK and install the packages we need
        # packages must be set explicitly: the action's default list includes the
        # obsolete "tools" package, which Google removed and which fails the build.
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci

      - name: Build the mobile web bundle (Vite → mobile/www)
        working-directory: ui
        run: npm run build:mobile

      - name: Sync the web assets into the Android project
        working-directory: mobile
        run: |
          rm -rf android/capacitor-cordova-android-plugins
          npx cap sync android

      - name: Assemble the debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotion-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Pushes to main refresh a single rolling "latest" release, so the
      # README's download link always points at the newest build.
      - name: Update the rolling "latest" build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: Automatically built from the latest commit on `main` (${{ github.sha }}).
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      # Version tags (v1.2.3) also get their own permanent release.
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
